<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title id="pageTitle">Invitation — BDH Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
:root{
  --ink:#17161c;--ink-2:#232128;--paper:#faf7f2;--card:#ffffff;
  --gold:#b08d3f;--gold-light:#e8d9b0;--gold-deep:#8a6a26;
  --line:#e7e3db;--line-strong:#d8d2c4;
  --muted:#6f6a5f;--success:#1f7a4d;--success-bg:#e7f5ec;
  --danger:#a5311f;--danger-bg:#fbeae7;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;overflow-x:hidden;}
h1,h2,h3{margin:0;font-family:'Playfair Display',serif;font-weight:600;}
p{margin:0}
button{font-family:inherit;cursor:pointer}

#envelopeScreen{
  position:fixed; inset:0; z-index:100;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 30%, #2a2620 0%, #171511 70%);
  transition:opacity .6s ease, visibility .6s ease;
}
#envelopeScreen.hidden{opacity:0; visibility:hidden; pointer-events:none;}

.env-eyebrow{
  position:absolute; top:14%; left:0; right:0; text-align:center;
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.05rem;
  color:rgba(232,217,176,0.75); letter-spacing:0.02em;
  opacity:0; animation:fadeIn 1s ease forwards .3s;
}

.envelope-3d{
  position:relative; width:260px; height:175px;
  perspective:1200px; cursor:pointer;
  opacity:0; animation:fadeIn 1s ease forwards .1s;
}
.env-body{
  position:absolute; inset:0; top:28px;
  background:linear-gradient(160deg,#f6f1e6,#ece3cf);
  border-radius:2px;
  box-shadow:0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(176,141,63,0.25);
}
.env-body::before{
  content:"";
  position:absolute; inset:10px;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(176,141,63,0.12) 0, transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(176,141,63,0.12) 0, transparent 35%);
  pointer-events:none;
}
.env-pocket{
  position:absolute; left:0; right:0; bottom:0; height:120px;
  background:linear-gradient(180deg,#efe7d4,#e6dcc4);
  clip-path:polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
}
.env-flap{
  position:absolute; top:28px; left:0; right:0; height:100px;
  background:linear-gradient(200deg,#f8f3e8,#ece2ca);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center;
  transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.6,0,.3,1);
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
  z-index:3;
}
.envelope-3d.open .env-flap{ transform:rotateX(-178deg); }

.wax-seal{
  position:absolute; top:74px; left:50%; transform:translate(-50%,0);
  width:58px; height:58px; border-radius:50%; z-index:5;
  background:radial-gradient(circle at 35% 30%, #cda54a, var(--gold-deep) 70%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.4), inset 0 -3px 6px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.3);
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:19px; color:#3a2b0d;
  transition:transform .5s ease, opacity .5s ease;
  animation:sealPulse 2.2s ease-in-out infinite;
}
.envelope-3d.open .wax-seal{ transform:translate(-50%,0) scale(0); opacity:0; }
@keyframes sealPulse{
  0%,100%{ box-shadow:0 6px 16px rgba(0,0,0,0.4), inset 0 -3px 6px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.3), 0 0 0 0 rgba(232,217,176,0.0);}
  50%{ box-shadow:0 6px 16px rgba(0,0,0,0.4), inset 0 -3px 6px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.3), 0 0 0 10px rgba(232,217,176,0.08);}
}

.env-glow{
  position:absolute; top:28px; left:50%; transform:translateX(-50%);
  width:10px; height:10px; border-radius:50%;
  background:radial-gradient(circle, #fff8e0 0%, rgba(255,248,224,0) 70%);
  opacity:0; z-index:4; pointer-events:none;
}
.envelope-3d.open .env-glow{
  animation:glowBurst 1s ease-out forwards .5s;
}
@keyframes glowBurst{
  0%{ opacity:0; width:10px; height:10px; }
  40%{ opacity:1; width:340px; height:340px; }
  100%{ opacity:0; width:420px; height:420px; }
}

.env-hint{
  position:absolute; bottom:16%; left:0; right:0; text-align:center;
  font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
  color:rgba(232,217,176,0.6);
  opacity:0; animation:fadeIn 1s ease forwards .6s;
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.wrap{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);}

.hero-section{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:60px 30px; position:relative; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(176,141,63,0.08), transparent 60%),
    var(--paper);
}
.hero-bg-image{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
}
.hero-bg-overlay{
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(180deg, rgba(23,22,28,0.35) 0%, rgba(23,22,28,0.15) 40%, rgba(23,22,28,0.55) 100%);
}
.hero-section.has-image .hero-eyebrow{ color:#f4ecd8; }
.hero-section.has-image .hero-names{ color:#fff; text-shadow:0 2px 18px rgba(0,0,0,0.35); }
.hero-section.has-image .hero-sub{ color:#f4ecd8; }
.hero-section.has-image .scroll-cue{ color:#f4ecd8; }
.hero-section > *{ position:relative; z-index:2; }
.hero-eyebrow{
  font-size:11.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-deep);
  margin-bottom:18px; opacity:0;
}
.hero-names{
  font-size:2.5rem; line-height:1.2; margin-bottom:14px; opacity:0;
}
.hero-sub{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.15rem; color:var(--muted); opacity:0; }
.hero-fade-in{ animation:fadeIn 1s ease forwards; }

.scroll-cue{
  position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.9rem; color:var(--muted);
  opacity:0;
}
.scroll-cue i{ animation:bounce 1.8s ease-in-out infinite; font-size:16px; }
@keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

.reveal-section{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
.reveal-section.in{ opacity:1; transform:translateY(0); }

.section{ padding:70px 28px; text-align:center; }
.section-tag{ font-size:1.6rem; margin-bottom:6px; }
.section-hint{ font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold-deep); font-size:0.95rem; margin-bottom:30px; }

.scratch-row{ display:flex; gap:12px; justify-content:center; margin-bottom:8px; }
.scratch-card{
  position:relative; width:88px; height:104px; border-radius:10px; overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.1); background:var(--card);
  border:1px solid var(--line);
}
.scratch-reveal{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif; font-weight:600; font-size:1.5rem; color:var(--ink);
}
.scratch-canvas{ position:absolute; inset:0; touch-action:none; cursor:pointer; }
.scratch-label{ font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-top:8px; }
.scratch-labels-row{ display:flex; gap:12px; justify-content:center; margin-bottom:26px; }
.scratch-labels-row span{ width:88px; text-align:center; }

.date-line{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.05rem; color:var(--muted); }

.detail-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:22px 24px; text-align:left; display:flex; flex-direction:column; gap:16px;
  max-width:340px; margin:0 auto;
}
.detail-row{ display:flex; align-items:flex-start; gap:12px; }
.detail-row i{ font-size:19px; color:var(--gold); margin-top:1px; flex-shrink:0; }
.detail-row .primary{ font-size:0.94rem; font-weight:500; }
.detail-row .secondary{ font-size:0.82rem; color:var(--muted); margin-top:1px; }

.guest-name-block{ margin-bottom:10px; }
.guest-name-block .lbl{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
.guest-name-block .name{ font-family:'Playfair Display',serif; font-size:1.2rem; }

.rsvp-actions{ max-width:320px; margin:24px auto 0; }
.btn{ width:100%; padding:15px; border-radius:10px; font-weight:600; font-size:0.94rem; border:1px solid transparent; margin-bottom:10px; }
.btn-primary{ background:var(--ink); color:#fff; }
.btn-primary:hover{ background:var(--ink-2); }
.btn-outline{ background:transparent; border-color:var(--line-strong); color:var(--ink); margin-bottom:0; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }

.rsvp-done{ padding:10px 28px 0; }
.rsvp-icon{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:24px; }
.rsvp-done.yes .rsvp-icon{ background:var(--success-bg); color:var(--success); }
.rsvp-done.no .rsvp-icon{ background:var(--danger-bg); color:var(--danger); }
.change-response{ margin-top:16px; background:none; border:none; font-size:0.82rem; color:var(--muted); text-decoration:underline; }
.rsvp-error{ color:var(--danger); font-size:0.82rem; text-align:center; margin-top:14px; }

.footer-note{ text-align:center; padding:30px 24px 50px; font-size:11px; color:var(--muted); letter-spacing:0.03em; }
.footer-note a{ color:inherit; font-weight:600; }

.empty-state{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:60px 28px; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<div id="envelopeScreen">
  <div class="env-eyebrow">Vous avez reçu une invitation</div>
  <div class="envelope-3d" id="envelopeEl">
    <div class="env-glow"></div>
    <div class="env-body"></div>
    <div class="env-pocket"></div>
    <div class="env-flap"></div>
    <div class="wax-seal" id="waxSeal">--</div>
  </div>
  <div class="env-hint">Touchez le cachet pour ouvrir</div>
</div>

<div class="wrap" id="app">
  <div class="empty-state" id="loading">Chargement de votre invitation...</div>
</div>

<script>
const SUPA_URL = 'https://rzibogatodeondtlnepz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6aWJvZ2F0b2Rlb25kdGxuZXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MTU4NTksImV4cCI6MjA5Njk5MTg1OX0.iKGsoabgJPpRLXW7aQ0ooKu_HB5ncnqkOtPA1pp9kjc';

let guestData = null;

function headers(){
  return { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` };
}

function initials(name){
  return (name || '?').split(/[\s&]+/).filter(Boolean).map(w => w[0]).slice(0,2).join('').toUpperCase();
}

async function loadInvitation(){
  const token = new URLSearchParams(location.search).get('token');
  const app = document.getElementById('app');

  if(!token){
    document.getElementById('envelopeScreen').classList.add('hidden');
    app.innerHTML = `<div class="empty-state"><i class="ti ti-mail-off" style="font-size:32px;margin-bottom:10px;display:block;"></i>Aucune invitation spécifiée.</div>`;
    return;
  }

  try{
    const res = await fetch(
      `${SUPA_URL}/rest/v1/invite_guests?invite_token=eq.${encodeURIComponent(token)}&select=*,invite_events(*),invite_rsvps(response),invite_tables(name)`,
      { headers: headers() }
    );
    const rows = await res.json();

    if(!res.ok || !rows.length || !rows[0].invite_events){
      document.getElementById('envelopeScreen').classList.add('hidden');
      app.innerHTML = `<div class="empty-state"><i class="ti ti-mail-off" style="font-size:32px;margin-bottom:10px;display:block;"></i>Cette invitation est introuvable ou n'est plus valide.</div>`;
      return;
    }

    guestData = rows[0];
    document.getElementById('waxSeal').textContent = initials(guestData.invite_events.name);
    render();

    if(!guestData.invitation_opened_at){
      fetch(`${SUPA_URL}/rest/v1/invite_guests?id=eq.${guestData.id}`, {
        method: 'PATCH', headers: headers(),
        body: JSON.stringify({ invitation_opened_at: new Date().toISOString() }),
      }).catch(()=>{});
    }
  }catch(err){
    document.getElementById('envelopeScreen').classList.add('hidden');
    app.innerHTML = `<div class="empty-state"><i class="ti ti-mail-off" style="font-size:32px;margin-bottom:10px;display:block;"></i>Une erreur est survenue.</div>`;
  }
}

function render(){
  const g = guestData;
  const e = g.invite_events;
  const existingResponse = g.invite_rsvps?.response;

  document.title = `Invitation — ${e.name}`;

  const eventDate = new Date(e.event_date + 'T00:00:00');
  const dayNum = eventDate.getDate();
  const monthName = eventDate.toLocaleDateString('fr-FR', { month: 'long' }).replace(/^./, c => c.toUpperCase());
  const yearNum = eventDate.getFullYear();
  const fullDateStr = eventDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).replace(/^./, c => c.toUpperCase());
  const timeStr = e.event_time ? `À partir de ${e.event_time.slice(0,5)}` : '';

  const eyebrowLabel = { mariage: 'Vous êtes invité·e', anniversaire: 'Vous êtes convié·e' }[e.event_type] || 'Vous êtes invité·e';
  const verbLabel = { mariage: 'se marient' }[e.event_type] || '';

  let rsvpHtml;
  if(existingResponse){
    const isYes = existingResponse === 'oui';
    rsvpHtml = `
      <div class="rsvp-done ${isYes?'yes':'no'}">
        <div class="rsvp-icon"><i class="ti ti-${isYes?'check':'x'}"></i></div>
        <h3 style="font-size:1.25rem;margin-bottom:8px;">${isYes ? 'Présence confirmée' : 'Réponse enregistrée'}</h3>
        <p style="font-size:0.88rem;color:var(--muted);">${isYes ? `Merci ${g.first_name}, nous avons hâte de vous voir.` : `Merci de nous avoir prévenus, ${g.first_name}.`}</p>
        <div style="text-align:center;"><button class="change-response" onclick="resetRsvp()">Modifier ma réponse</button></div>
      </div>`;
  } else {
    rsvpHtml = `
      <div class="rsvp-actions" id="actionsBlock">
        <button class="btn btn-primary" onclick="submitRsvp('oui')" id="btnYes">Confirmer ma présence</button>
        <button class="btn btn-outline" onclick="submitRsvp('non')" id="btnNo">Je ne pourrai pas venir</button>
      </div>`;
  }

  document.getElementById('app').innerHTML = `
    <section class="hero-section${e.hero_image_url ? ' has-image' : ''}">
      ${e.hero_image_url ? `<img class="hero-bg-image" src="${e.hero_image_url}" alt=""><div class="hero-bg-overlay"></div>` : ''}
      <div class="hero-eyebrow hero-fade-in" style="animation-delay:.1s">${eyebrowLabel}</div>
      <h1 class="hero-names hero-fade-in" style="animation-delay:.3s">${e.name}</h1>
      ${verbLabel ? `<p class="hero-sub hero-fade-in" style="animation-delay:.5s">${verbLabel}</p>` : ''}
      <div class="scroll-cue hero-fade-in" style="animation-delay:1s">Faites défiler<i class="ti ti-chevron-down"></i></div>
    </section>

    <section class="section reveal-section" id="dateSection">
      <div class="section-hint">✦ Grattez pour révéler la date ✦</div>
      <h2 class="section-tag">La date</h2>
      <div style="height:24px;"></div>
      <div class="scratch-row">
        <div class="scratch-card"><div class="scratch-reveal">${dayNum}</div><canvas class="scratch-canvas" id="scratchDay"></canvas></div>
        <div class="scratch-card"><div class="scratch-reveal" style="font-size:1.1rem;">${monthName}</div><canvas class="scratch-canvas" id="scratchMonth"></canvas></div>
        <div class="scratch-card"><div class="scratch-reveal">${yearNum}</div><canvas class="scratch-canvas" id="scratchYear"></canvas></div>
      </div>
      <div class="scratch-labels-row"><span class="scratch-label">Jour</span><span class="scratch-label">Mois</span><span class="scratch-label">Année</span></div>
      <p class="date-line">${fullDateStr}</p>
    </section>

    <section class="section reveal-section" id="detailsSection">
      <h2 class="section-tag" style="margin-bottom:24px;">Détails</h2>
      <div class="detail-card">
        <div class="detail-row"><i class="ti ti-calendar"></i><div><p class="primary">${fullDateStr}</p>${timeStr?`<p class="secondary">${timeStr}</p>`:''}</div></div>
        ${e.location_name ? `<div class="detail-row"><i class="ti ti-map-pin"></i><div><p class="primary">${e.location_name}</p>${e.address?`<p class="secondary">${e.address}</p>`:''}</div></div>` : ''}
        ${g.invite_tables?.name ? `<div class="detail-row"><i class="ti ti-armchair"></i><div><p class="primary">${g.invite_tables.name}</p></div></div>` : ''}
      </div>
    </section>

    <section class="section reveal-section" id="rsvpSection">
      <div class="guest-name-block">
        <div class="lbl">Invitation pour</div>
        <div class="name">${g.first_name} ${g.last_name||''}</div>
      </div>
      <div id="rsvpBlock">${rsvpHtml}</div>
      <div id="rsvpErrorBox"></div>
    </section>

    <div class="footer-note">Invitation envoyée par <a href="#" onclick="return false;">Bénin Digital Hub</a></div>
  `;

  setupScrollReveal();
  if(!existingResponse){
    setupScratchCard('scratchDay');
    setupScratchCard('scratchMonth');
    setupScratchCard('scratchYear');
  } else {
    setupScratchCard('scratchDay', true);
    setupScratchCard('scratchMonth', true);
    setupScratchCard('scratchYear', true);
  }
}

function resetRsvp(){
  guestData.invite_rsvps = null;
  render();
}

function setupScrollReveal(){
  const els = document.querySelectorAll('.reveal-section');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){ entry.target.classList.add('in'); obs.unobserve(entry.target); }
    });
  }, { threshold: 0.2 });
  els.forEach(el => obs.observe(el));
}

function setupScratchCard(canvasId, preRevealed){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  if(preRevealed){
    canvas.style.display = 'none';
    return;
  }

  const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
  grad.addColorStop(0, '#d8bd76');
  grad.addColorStop(0.5, '#c9a85c');
  grad.addColorStop(1, '#b08d3f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, rect.width, rect.height);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '600 10px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✦ Grattez ✦', rect.width/2, rect.height/2);

  let isDown = false;
  let totalMoves = 0;
  let cleared = false;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x: cx, y: cy};
  }

  function erase(x, y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI*2);
    ctx.fill();
  }

  function checkCleared(){
    if(cleared) return;
    totalMoves++;
    if(totalMoves > 14){
      cleared = true;
      canvas.style.transition = 'opacity .4s ease';
      canvas.style.opacity = '0';
      setTimeout(() => { canvas.style.display = 'none'; }, 400);
    }
  }

  function start(e){ isDown = true; const p = pos(e); erase(p.x, p.y); checkCleared(); }
  function move(e){ if(!isDown) return; e.preventDefault(); const p = pos(e); erase(p.x, p.y); checkCleared(); }
  function end(){ isDown = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:true});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}

async function submitRsvp(response){
  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  if(btnYes) btnYes.disabled = true;
  if(btnNo) btnNo.disabled = true;
  document.getElementById('rsvpErrorBox').innerHTML = '';

  try{
    const res = await fetch(`${SUPA_URL}/rest/v1/invite_rsvps?on_conflict=guest_id`, {
      method: 'POST',
      headers: { ...headers(), Prefer: 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify({ guest_id: guestData.id, response }),
    });
    if(!res.ok){
      const errBody = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + ' ' + errBody);
    }
    guestData.invite_rsvps = { response };
    render();
  }catch(err){
    console.error("Échec de l'envoi du RSVP :", err);
    if(btnYes) btnYes.disabled = false;
    if(btnNo) btnNo.disabled = false;
    document.getElementById('rsvpErrorBox').innerHTML = `<p class="rsvp-error">Votre réponse n'a pas pu être enregistrée. Merci de réessayer.</p>`;
  }
}

document.getElementById('envelopeEl').addEventListener('click', function(){
  this.classList.add('open');
  setTimeout(() => {
    document.getElementById('envelopeScreen').classList.add('hidden');
    document.body.style.overflow = '';
  }, 1300);
});
document.body.style.overflow = 'hidden';

loadInvitation();
</script>
