<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — BDH Site Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf7f2;--paper-2:#f2ece2;--ink:#1c1917;--ink-soft:#4a443c;
  --rust:#b54834;--rust-dark:#8e3626;--pine:#1f5c4f;--pine-light:#e7efec;
  --gold:#c08a28;--line:#e4ddd1;--line-strong:#d2c8b4;--card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);}
h1,h2,h3{margin:0;font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
p{margin:0}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:740px;margin:0 auto;padding:32px 22px 70px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line);}
.eyebrow{font-size:0.78rem;color:var(--ink-soft);margin-bottom:4px;}
.badge{font-size:11.5px;padding:4px 11px;font-weight:600;border:1px solid;}
.badge-live{background:var(--pine-light);color:var(--pine);border-color:var(--pine);}
.badge-cat{background:var(--paper-2);color:var(--ink-soft);border-color:var(--line-strong);}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px;}
.stat-card{background:var(--card);padding:18px 16px;}
.stat-label{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.stat-value{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);padding:22px;margin-bottom:18px;}
.card h3{font-size:1.05rem;margin-bottom:16px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:0.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line-strong);border-radius:2px;font-family:inherit;font-size:0.9rem;background:#fff;}
.field textarea{min-height:70px;resize:vertical;}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--rust);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);gap:16px;}
.toggle-row:first-of-type{border-top:none;}
.toggle-row div p:first-child{font-size:0.92rem;font-weight:600;font-family:'Fraunces',serif;}
.toggle-row div p:last-child{font-size:0.8rem;color:var(--ink-soft);margin-top:2px;}
.toggle{width:40px;height:22px;border-radius:100px;position:relative;flex-shrink:0;background:var(--line-strong);transition:background .15s ease;}
.toggle.on{background:var(--pine);}
.toggle-dot{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .15s ease;}
.toggle.on .toggle-dot{left:20px;}
.disabled-note{font-size:0.78rem;color:var(--gold);flex-shrink:0;}
.btn{padding:12px 22px;border-radius:2px;font-weight:600;font-size:0.88rem;border:1px solid transparent;font-family:'Inter',sans-serif;}
.btn-primary{background:var(--rust);color:#fff;}
.btn-primary:hover{background:var(--rust-dark);}
.btn-outline{background:transparent;border-color:var(--line-strong);color:var(--ink);}
.link-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-2);padding:12px 16px;font-size:0.85rem;}
.link-row a{color:var(--pine);font-weight:600;text-decoration:none;word-break:break-all;}
.upsell{background:var(--paper-2);border:1px solid var(--line-strong);border-left:3px solid var(--gold);padding:20px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.error-box{background:#fbeae7;color:#8e3626;padding:20px;text-align:center;border:1px solid #e3b8ac;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;font-size:0.88rem;opacity:0;transition:opacity .3s ease;pointer-events:none;font-family:'Inter',sans-serif;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <p style="text-align:center;color:var(--ink-soft);padding:50px 0;">Chargement...</p>
</div>
<div class="toast" id="toast">Enregistré</div>

<script>
const SUPA_URL = 'https://rzibogatodeondtlnepz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6aWJvZ2F0b2Rlb25kdGxuZXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MTU4NTksImV4cCI6MjA5Njk5MTg1OX0.iKGsoabgJPpRLXW7aQ0ooKu_HB5ncnqkOtPA1pp9kjc';

let currentSite = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function loadDashboard(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const token = params.get('token');
  const app = document.getElementById('app');

  if(!slug || !token){
    app.innerHTML = '<div class="error-box">Lien de gestion invalide. Vérifiez le lien reçu à la publication de votre site.</div>';
    return;
  }

  const res = await fetch(`${SUPA_URL}/rest/v1/sitebuilder_sites?slug=eq.${encodeURIComponent(slug)}&select=*`, {
    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
  });
  const rows = await res.json();

  if(!rows.length || rows[0].manage_token !== token){
    app.innerHTML = '<div class="error-box">Lien de gestion invalide ou expiré.</div>';
    return;
  }

  currentSite = rows[0];
  render();
}

function render(){
  const s = currentSite;
  const siteUrl = `${location.origin}${location.pathname.replace('bdh-site-dashboard.html','bdh-site-view.html')}?slug=${s.slug}`;
  const categoryLabels = { artisan:'Artisan', commerce:'Commerce', independant:'Indépendant', beaute:'Beauté' };
  const wezikaEligible = s.category === 'artisan';
  const yeyeEligible = s.category === 'commerce';
  const eloxEligible = s.category === 'beaute';

  document.getElementById('app').innerHTML = `
    <div class="top">
      <div>
        <p class="eyebrow">Mon site</p>
        <h2>${s.business_name}</h2>
      </div>
      <div style="display:flex;gap:8px;">
        <span class="badge badge-live">En ligne</span>
        <span class="badge badge-cat">${categoryLabels[s.category] || s.category}</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Visites</div><div class="stat-value">${s.views_count}</div></div>
      <div class="stat-card"><div class="stat-label">Clics WhatsApp</div><div class="stat-value">${s.whatsapp_clicks}</div></div>
      <div class="stat-card"><div class="stat-label">Produits</div><div class="stat-value">${(s.products||[]).length}</div></div>
    </div>

    <div class="card">
      <h3>Mon site</h3>
      <div class="link-row">
        <a href="${siteUrl}" target="_blank">${siteUrl}</a>
        <button class="btn btn-outline" onclick="navigator.clipboard.writeText('${siteUrl}');toast('Lien copié')">Copier</button>
      </div>
    </div>

    <div class="card">
      <h3>Modifier mes informations</h3>
      <div class="field"><label>Nom de l'entreprise</label><input id="editName" value="${s.business_name || ''}"></div>
      <div class="field"><label>Description</label><textarea id="editDesc">${s.description || ''}</textarea></div>
      <div class="field"><label>WhatsApp</label><input id="editWhatsapp" value="${s.whatsapp || ''}"></div>
      <div class="field"><label>Adresse</label><input id="editAddress" value="${s.address || ''}"></div>
      <button class="btn btn-primary" onclick="saveInfo()">Enregistrer</button>
    </div>

    <div class="card">
      <h3>Visibilité sur l'écosystème BDH</h3>
      <div class="toggle-row">
        <div><p>Visible sur WEZIKA</p><p>${wezikaEligible ? 'Votre fiche apparaît dans la marketplace de services.' : 'Réservé aux artisans / prestataires de service.'}</p></div>
        ${wezikaEligible
          ? `<div class="toggle ${s.wezika_visible?'on':''}" id="toggleWezika" onclick="toggleField('wezika_visible','toggleWezika')"><div class="toggle-dot"></div></div>`
          : `<span class="disabled-note">Non applicable</span>`}
      </div>
      <div class="toggle-row">
        <div><p>Visible sur YéyéMarket</p><p>${yeyeEligible ? 'Vos produits apparaissent sur la marketplace alimentaire.' : 'Réservé aux commerces de produits.'}</p></div>
        ${yeyeEligible
          ? `<div class="toggle ${s.yeyemarket_visible?'on':''}" id="toggleYeye" onclick="toggleField('yeyemarket_visible','toggleYeye')"><div class="toggle-dot"></div></div>`
          : `<span class="disabled-note">Non applicable</span>`}
      </div>
      <div class="toggle-row">
        <div><p>Visible sur ELOX</p><p>${eloxEligible ? 'Votre profil apparaît sur la marketplace beauté et bien-être.' : 'Réservé aux prestataires beauté / bien-être.'}</p></div>
        ${eloxEligible
          ? `<div class="toggle ${s.elox_visible?'on':''}" id="toggleElox" onclick="toggleField('elox_visible','toggleElox')"><div class="toggle-dot"></div></div>`
          : `<span class="disabled-note">Non applicable</span>`}
      </div>
    </div>

    <div class="upsell">
      <div>
        <p style="font-weight:600;margin-bottom:4px;font-family:'Fraunces',serif;">Passez à un domaine personnalisé</p>
        <p style="font-size:0.85rem;color:var(--ink-soft);">${s.slug}.bj au lieu de bdh.site/s/${s.slug} — 6 000 F/an</p>
      </div>
      <button class="btn btn-primary">Passer au domaine perso</button>
    </div>
  `;
}

async function toggleField(field, elId){
  const newValue = !currentSite[field];
  document.getElementById(elId).classList.toggle('on', newValue);
  currentSite[field] = newValue;
  await fetch(`${SUPA_URL}/rest/v1/sitebuilder_sites?slug=eq.${encodeURIComponent(currentSite.slug)}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
    body: JSON.stringify({ [field]: newValue }),
  });
  toast(newValue ? 'Activé' : 'Désactivé');
}

async function saveInfo(){
  const payload = {
    business_name: document.getElementById('editName').value.trim(),
    description: document.getElementById('editDesc').value.trim(),
    whatsapp: document.getElementById('editWhatsapp').value.trim(),
    address: document.getElementById('editAddress').value.trim(),
  };
  await fetch(`${SUPA_URL}/rest/v1/sitebuilder_sites?slug=eq.${encodeURIComponent(currentSite.slug)}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
    body: JSON.stringify(payload),
  });
  Object.assign(currentSite, payload);
  toast('Modifications enregistrées');
  render();
}

loadDashboard();
</script>
</body>
</html>
