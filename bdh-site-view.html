<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Chargement... — BDH Site Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;line-height:1.6;background:#e9e6df;}
h1,h2{margin:0;font-family:'Fraunces',serif;font-weight:600;}
p{margin:0}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;}
.hero{padding:34px 24px 26px;position:relative;overflow:hidden;}
.hero-mark{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;margin-bottom:16px;position:relative;z-index:1;}
.hero h1{font-size:1.65rem;margin-bottom:8px;position:relative;z-index:1;line-height:1.15;}
.hero p.desc{font-size:0.92rem;opacity:0.82;max-width:34ch;position:relative;z-index:1;}
.hero .addr{display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;margin-top:14px;padding:5px 12px;border:1px solid;position:relative;z-index:1;}
.section{padding:26px 24px;}
.section-title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;margin-bottom:4px;}
.section-sub{font-size:0.8rem;color:#8a8478;margin-bottom:18px;}
.product{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid #ece7dd;}
.product:first-child{border-top:1px solid #ece7dd;}
.product-name{font-family:'Fraunces',serif;font-size:1rem;font-weight:500;color:#1c1917;}
.product-price{font-size:0.88rem;font-weight:600;white-space:nowrap;flex-shrink:0;}
.cta-bar{padding:8px 24px 20px;}
.cta-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;color:#fff;font-weight:600;font-size:0.94rem;text-decoration:none;border:none;font-family:'Inter',sans-serif;}
.kkia-btn{margin-top:10px;background:#fff;border:1px solid #d8d2c4;color:#1c1917;}
.footer{text-align:center;padding:18px 24px 30px;font-size:0.72rem;color:#a39c8c;letter-spacing:0.03em;border-top:1px solid #ece7dd;}
.footer a{color:inherit;font-weight:600;}
.empty{padding:80px 24px;text-align:center;color:#a39c8c;font-family:'Inter',sans-serif;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="empty" id="loading">Chargement du site...</div>
</div>

<script>
const SUPA_URL = 'https://rzibogatodeondtlnepz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6aWJvZ2F0b2Rlb25kdGxuZXB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MTU4NTksImV4cCI6MjA5Njk5MTg1OX0.iKGsoabgJPpRLXW7aQ0ooKu_HB5ncnqkOtPA1pp9kjc';

const THEME_STYLES = {
  aube:   { hero:'#16332e', text:'#fdfaf4', sub:'#a9d2c4', tagBorder:'#3c6d61', accent:'#16332e', accentSoft:'#e7efec', patternColor:'255,255,255' },
  eclat:  { hero:'#7a2e14', text:'#fdf6ef', sub:'#f0bd97', tagBorder:'#a8552f', accent:'#7a2e14', accentSoft:'#faeee5', patternColor:'255,255,255' },
  epure:  { hero:'#1c1917', text:'#f7f5f0', sub:'#c9c2b3', tagBorder:'#4a453d', accent:'#1c1917', accentSoft:'#f0eee9', patternColor:'255,255,255' },
  petale: { hero:'#651b3a', text:'#fdf3f6', sub:'#e8b0c6', tagBorder:'#93365f', accent:'#651b3a', accentSoft:'#faeaf0', patternColor:'255,255,255' },
};

function waLink(number, text){
  const digits = (number||'').replace(/[^\d]/g,'');
  return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
}

function initials(name){
  return (name || '?').split(' ').map(w => w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
}

async function loadSite(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const app = document.getElementById('app');

  if(!slug){
    app.innerHTML = '<div class="empty">Aucun site spécifié.</div>';
    return;
  }

  try{
    const res = await fetch(`${SUPA_URL}/rest/v1/sitebuilder_sites?slug=eq.${encodeURIComponent(slug)}&select=*`, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
    });
    const rows = await res.json();
    if(!rows.length){
      app.innerHTML = '<div class="empty">Ce site n\'existe pas ou plus.</div>';
      return;
    }
    const site = rows[0];
    const t = THEME_STYLES[site.theme] || THEME_STYLES.aube;

    document.getElementById('pageTitle').textContent = site.business_name + ' — Propulsé par BDH';

    const products = Array.isArray(site.products) ? site.products : [];
    const productsHtml = products.length ? products.map(p => `
      <div class="product">
        <span class="product-name">${p.name || ''}</span>
        <span class="product-price" style="color:${t.accent}">${p.price ? Number(p.price).toLocaleString('fr-FR') + ' F' : ''}</span>
      </div>`).join('') : '<p style="font-size:0.85rem;color:#a39c8c;padding:16px 0;">Aucun produit renseigné pour le moment.</p>';

    app.innerHTML = `
      <div class="hero" style="background:${t.hero}; color:${t.text};">
        <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(${t.patternColor},0.05) 1px, transparent 1px);background-size:14px 14px;"></div>
        <div class="hero-mark" style="background:rgba(${t.patternColor},0.12); color:${t.text};">${initials(site.business_name)}</div>
        <h1>${site.business_name}</h1>
        ${site.description ? `<p class="desc">${site.description}</p>` : ''}
        ${site.address ? `<div class="addr" style="color:${t.sub}; border-color:${t.tagBorder}">${site.address}</div>` : ''}
      </div>

      <div class="section">
        <div class="section-title">Ce que nous proposons</div>
        <div class="section-sub">Produits et services</div>
        ${productsHtml}
      </div>

      <div class="cta-bar">
        ${site.whatsapp ? `<a class="cta-btn" style="background:${t.accent}" href="${waLink(site.whatsapp, 'Bonjour, je vous contacte depuis votre site ' + site.business_name)}" target="_blank" onclick="trackClick('${site.slug}')">Contacter sur WhatsApp</a>` : ''}
        ${site.kkiapay_link ? `<a class="cta-btn kkia-btn" href="${site.kkiapay_link}" target="_blank">Payer / commander en ligne</a>` : ''}
      </div>

      <div class="footer">Propulsé par <a href="#" onclick="return false;">Bénin Digital Hub</a></div>
    `;

    fetch(`${SUPA_URL}/rest/v1/rpc/sitebuilder_increment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
      body: JSON.stringify({ p_slug: slug, p_field: 'views_count' }),
    }).catch(()=>{});

  }catch(err){
    app.innerHTML = '<div class="empty">Une erreur est survenue.</div>';
    console.error(err);
  }
}

function trackClick(slug){
  fetch(`${SUPA_URL}/rest/v1/rpc/sitebuilder_increment`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` },
    body: JSON.stringify({ p_slug: slug, p_field: 'whatsapp_clicks' }),
  }).catch(()=>{});
}

loadSite();
</script>
</body>
</html>
